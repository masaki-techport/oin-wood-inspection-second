# DIO Device Configuration
# This file contains settings for the DIO (Digital I/O) device used for sensor monitoring

# Device name for DIO initialization
dev_name: "DIO000"

# Sensor bit assignments
sensor_bits:
  bit_a: 0
  bit_b: 1

# Device settings
device_settings:
  timeout_ms: 5000
  retry_attempts: 3
  retry_delay_ms: 100

# Simulation mode (when real hardware is not available)
simulation:
  enabled: false
  sensor_a_default: false
  sensor_b_default: false
