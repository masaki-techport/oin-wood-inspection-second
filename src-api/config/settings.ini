[DEBUG]
debug_mode = 0
show_debug_windows = 0
verbose_logging = 0
debug_capture_time = 0
show_debug_panel = 0
show_camera_setting = 0

[CAMERA]
default_camera_type = webcam
auto_reconnect = 1
connection_timeout = 5

[SENSOR]
simulation_mode = 1
buffer_duration = 30
buffer_fps = 10

[UI]
polling_interval = 200
notification_timeout = 5000

[INSPECTION]
camera_exposure = 1000
lighting_intensity = 50
ai_threshold = 50
length_threshold = 10.0
temp_section_size = 5
temp_section_max_visible = -1

[CALCULATED_RESOLUTION]
horizontal_mm_per_pixel = 0.046069
vertical_mm_per_pixel = 0.049131

[LOG]
log_folder = ./log
when = midnight
interval = 1
max_save_days = 7
at_time = 00:00
name_as = wood_inspection
level = INFO
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
timestamp_format = %Y-%m-%d %H:%M:%S